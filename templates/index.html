<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Clasificador de Ataques de Ciberseguridad</title>

    <!-- Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
        }

        textarea {
            resize: none;
        }

        .btn-custom {
            background-color: #00c6ff;
            border: none;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #0072ff;
            transform: scale(1.05);
        }
    </style>

</head>

<body>

    <div class="container text-center mt-5">

        <h1 class="mb-4">Clasificador de Ataques de Ciberseguridad</h1>
        <p class="mb-4">Analiza una descripción de un ataque y clasifícalo automáticamente usando Machine Learning</p>

        <div class="card p-4 shadow-lg bg-dark">

            <form action="/predict" method="post">

                <textarea name="texto" class="form-control mb-3"
                    placeholder="Escribe aquí la descripción del ataque (puede ser en español o inglés)"
                    rows="4"></textarea>

                <button type="submit" class="btn btn-custom btn-lg w-100">
                    Analizar ataque
                </button>

            </form>
        </div>

        <!-- RESULTADO -->
        {% if prediction %}
            <div class="card mt-4 p-4 shadow bg-success">
                <h2>✅ Resultado: {{ prediction }}</h2>
            </div>
        {% endif %}

    </div>

</body>
</html>
